name: Terraform + Deploy to S3

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Run tests
        run: echo "tests passed"

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Package artifact
        run: |
          zip -r website-v${{ github.run_number }}.zip index.html about.html
          echo "Packaged website-v${{ github.run_number }}.zip successfully"

      - name: Upload to Nexus
        run: |
          curl -u ${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASSWORD }} \
            -H "ngrok-skip-browser-warning: true" \
            --upload-file website-v${{ github.run_number }}.zip \
            ${{ secrets.NEXUS_URL }}/repository/website-artifacts/website-v${{ github.run_number }}.zip
          echo "Uploaded to Nexus successfully"

      - name: Download from Nexus
        run: |
          curl -u ${{ secrets.NEXUS_USER }}:${{ secrets.NEXUS_PASSWORD }} \
            -H "ngrok-skip-browser-warning: true" \
            -O ${{ secrets.NEXUS_URL }}/repository/website-artifacts/website-v${{ github.run_number }}.zip
          unzip -o website-v${{ github.run_number }}.zip
          echo "Downloaded and extracted from Nexus successfully"

      - name: Deploy site to S3
        run: |
          aws s3 cp index.html s3://jayaguru-v2/index.html
          aws s3 cp about.html s3://jayaguru-v2/about.html
